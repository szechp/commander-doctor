# Pre-registered known answers for the Forge scenario bench (Phase 0 gate).
# Written BEFORE the bench exists or has run, from oracle text checked with
# `deckdoctor card` on 2026-10-16. Do not edit after the first run except to
# record the user's approval; changing an expectation after seeing results
# would make the gate meaningless.
#
# Interaction I(A,B) = m(A+B) - m(A) - m(B) + m(empty board), measured over one
# full round of real turns on the fixed board recipe (plan: our seat with 10
# untapped basics, land drop used, three 1/1 Changeling tokens, one
# ability-less artifact, a basic-land discard card in hand, 30 basics in the
# library; three passive opponents at 40 life, each with a tapped Ornithopter
# and an ability-less enchantment). Every in-game decision is Forge's AI.
#
# Metrics (opponent metrics summed over all three opponents):
#   opp_life_lost, opp_life_lost_noncombat, opp_life_lost_combat, cards_drawn,
#   net_mana_after_b, treasures_created, tokens_created, our_creatures_died,
#   opp_creatures_died, spells_cast, spells_copied, p1p1_counters_placed,
#   scry_events, discards
#
# expect: exact value of I for deterministic entries; for non-deterministic
# ones (AI picks a target/player/mode) the sign and minimum.
# B "from": hand (cast), graveyard (cast from graveyard, e.g. flashback),
# battlefield (activate the named ability; the card is put onto the battlefield
# without summoning sickness first).

schema_version: 1
approved_by_user: 2026-10-16   # user: "Cool continue then." after reviewing the sheet

positives:
  # --- Sevinne spellslinger (cards live in the target list, not the current one)
  - id: sev-storm-kiln
    list: decks/sevinne-graveyard.target.txt
    a: Storm-Kiln Artist
    b: {card: Faithless Looting, from: hand}
    metric: treasures_created
    expect: {op: "==", value: 1}
    deterministic: true
    reason: "Storm-Kiln: whenever you cast or copy an instant or sorcery spell, create a Treasure."
  - id: sev-guttersnipe
    list: decks/sevinne-graveyard.target.txt
    a: Guttersnipe
    b: {card: Faithless Looting, from: hand}
    metric: opp_life_lost_noncombat
    expect: {op: "==", value: 6}
    deterministic: true
    reason: "Guttersnipe: whenever you cast an instant or sorcery, 2 damage to each opponent (3 opponents)."
  - id: sev-electromancer
    list: decks/sevinne-graveyard.target.txt
    a: Goblin Electromancer
    b: {card: Deep Analysis, from: hand}
    metric: net_mana_after_b
    expect: {op: "==", value: 1}
    deterministic: true
    reason: "Electromancer: instants and sorceries cost {1} less; Deep Analysis {3}{U} has generic to reduce."
  - id: sev-vivi
    list: decks/sevinne-graveyard.target.txt
    a: Vivi Ornitier
    b: {card: Faithless Looting, from: hand}
    metric: opp_life_lost_noncombat
    expect: {op: "==", value: 3}
    deterministic: true
    reason: "Vivi: whenever you cast a noncreature spell, +1/+1 counter and 1 damage to each opponent."
  - id: sev-sevinne-copy
    list: decks/sevinne-graveyard.target.txt
    a: Sevinne, the Chronoclasm
    b: {card: Faithless Looting, from: graveyard}
    metric: spells_copied
    expect: {op: "==", value: 1}
    deterministic: true
    reason: "Sevinne: whenever you cast your first instant or sorcery from your graveyard each turn, copy it (flashback {2}{R})."
  - id: sev-secrets
    list: decks/sevinne-graveyard.target.txt
    a: Secrets of the Dead
    b: {card: Faithless Looting, from: graveyard}
    metric: cards_drawn
    expect: {op: "==", value: 1}
    deterministic: true
    reason: "Secrets of the Dead: whenever you cast a spell from your graveyard, draw a card."
  - id: sev-past-in-flames
    list: decks/sevinne-graveyard.target.txt
    a: Past in Flames
    b: {card: Fiery Confluence, from: graveyard}
    metric: status
    expect: {op: "==", value: enables}
    deterministic: true
    reason: "Past in Flames gives instants/sorceries in the graveyard flashback until end of turn; Fiery Confluence has none on its own."

