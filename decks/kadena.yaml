gameplan: >
  Sultai (BUG) morph value. Kadena's discount (first face-down creature spell
  each turn costs 3 less) and draw trigger (whenever a face-down creature
  enters) turn a dense morph/disguise package into a stream of cards; mana
  dorks and rocks land Kadena on turns 2-3, and re-buy effects (Ixidron,
  Temur Sabertooth, Vesuvan Shapeshifter) re-trigger the draw. Heavy
  counterspells and spot removal keep the table in check. Threshold turn 5:
  Kadena plus 2-3 morphs online.

  Win route: a compact combo finisher that converts the grind into a win
  (chosen 2026-09-24), kept within bracket 3 (3 Game Changer cap, no
  early two-card infinites).
