commander: Ghired, Conclave Exile
bracket: 3
threshold: 5
edhrec_theme: populate
gameplan: >
  Token multiplication. Ramp into Ghired, Conclave Exile by turn 5 (turn 4 with
  ramp). Ghired's 4/4 trample Rhino and every populate trigger get multiplied by
  the deck's duplicators: doublers (Anointed Procession, Parallel Lives, Doubling
  Season, Mondrak, Glory Dominus, Exalted Sunborn) and the tripler (Ojer Taq,
  Deepest Foundation), which stack so one token becomes 4x/6x/12x. Repeatable
  populate (Growing Ranks, Trostani, Vitu-Ghazi Guildmage, Song of the Worldsoul,
  Ghired's attack) and burst copies (Second Harvest, Full Flowering) copy the
  biggest token available (Rhino, Beasts, Dragons, 10/10 Eldrazi). Card flow comes
  from big creatures entering (Garruk's Uprising, Elemental Bond, Garruk's
  Packleader). Win with trample combat damage from a board of large tokens.
  Duplicators are the core the user wants to keep.
