      5 50% -> 71%; colour-stuck spells by turn 4 0.69 -> 0.29; tapped land turns 0.70
      -> 0.33. Answers 10 -> 11 (now counting damage removal), coverage gap closed,
      protection 4 -> 7, wipes 2 -> 0 (on purpose: wipes kill the deck''s own engine).
      Precon cards 37 -> 20. Double-checked cuts: Garruk Primal Hunter (GGG), Packleader
