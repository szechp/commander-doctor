commander: Rem Karolus, Stalwart Slayer
bracket: 3
threshold: 3
edhrec_theme: burn
gameplan: >
  Commander-led damage reflection: Rem Karolus (flying haste, prevents all
  spell damage to you and your permanents, pumps your spell damage by 1)
  heads a reflector package of Boros Reckoner, Mogg Maniac, Brash Taunter,
  Phyrexian Vindicator and Stuffy Doll. Redirect (Pariah, With Great Power,
  Blazing Sunsteel) and doublers (Solphim, Gratuitous Violence,
  Repercussion, Arcbond) amplify into Blasphemous Act / Star of Extinction
  / Chandra's Ignition closers that only hurt opponents thanks to Rem.
  Tutors (Idyllic, Sunforger package, Imperial Recruiter / Recruiter of
  the Guard, Godo for equipment) assemble the engine fast. Wins by making
  symmetric damage one-sided and reflecting it at opponents.
