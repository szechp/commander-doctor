  - date: '2026-09-10'
    kind: pin
    card: Spitemare
    reason: 'not redundant with Boros Reckoner despite identical/worse-rate text: neither
      has indestructible, so both are fragile damage-redirect bodies for the Pariah
      plan. Running multiple non-indestructible redirectors alongside the indestructible
      ones (Stuffy Doll, Brash Taunter, Phyrexian Vindicator, Truefire Captain) is deliberate
      resilience -- losing one to lethal redirected damage without ending the game should
      not leave the plan with no backup body. Do not suggest cutting redirect-package
      creatures as ''redundant'' again.'
