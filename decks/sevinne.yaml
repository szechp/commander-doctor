  - date: '2026-09-10'
    kind: legality_exception
    card: Stingcaster Mage
    reason: 'local mirror marks it Commander-illegal (commander_legal: 0) -- likely
      a recently-printed card the sync hasn''t caught up on yet; user''s playgroup allows
      it (table ruling), expected to sync as legal soon. Real card kept in every analysis
      instead of a substitute (KNOWN_ISSUES.md).'
  - date: '2026-09-10'
    kind: note
    text: 'Correction to the Spitemare pin entry above: Phyrexian Vindicator and Truefire
      Captain were wrongly grouped as ''indestructible'' alongside Stuffy Doll and Brash
      Taunter. Verified against local oracle text: Stuffy Doll and Brash Taunter both
      have the Indestructible keyword. Phyrexian Vindicator has no Indestructible keyword
      -- its real defense is damage prevention (''If damage would be dealt to this creature,
      prevent that damage''), a different mechanism (stops non-destroy removal from
      working the way indestructible does not apply to e.g. exile/-X/-X, but also never
      dies to lethal damage the way indestructible does apply against non-damage destroy
      effects -- not equivalent, just also resilient). Truefire Captain has neither
      Indestructible nor damage prevention -- it is exactly as fragile as Spitemare
      and Boros Reckoner. The pin''s underlying point (redundant fragile-body resilience
      for the Pariah/redirect plan is deliberate, don''t cut as ''redundant'') still
      holds; only the indestructible grouping was wrong.'
