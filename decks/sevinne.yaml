commander: Sevinne, the Chronoclasm
bracket: 3
threshold: 8  # turn the kill/engine is actually online, NOT the commander's cmc (5) --
  # confirmed with user 2026-09-10. Nothing had this set before, so every threshold-
  # scaled floor (defence.py's interaction target, audit.py's ramp count) had been
  # silently running against the cmc-5 default, which understates how long this deck
  # is actually exposed before it can close a game. See gameplan below.
gameplan: >
  Jeskai (WUR) graveyard-recursion value engine, not an on-curve beater. Sevinne
  herself (real oracle text: "Prevent all damage that would be dealt to Sevinne.
  Whenever you cast your first instant or sorcery spell from your graveyard each
  turn, copy that spell.") turns flashback/graveyard recursion (Snapcaster Mage,
  Past in Flames, Mystic Retrieval, Sevinne's Reclamation) into repeated 2-for-1s.
  Setup: ramp (10 rocks + Sol Ring + Lotus Petal) turns 1-3, fill the graveyard via
  looting/discard (Faithless Looting, Desperate Ravings, Frantic Search, Deep
  Analysis) turns 2-5, Sevinne down ~turn 5, value engine running turns 5-7. Close
  with X-burn (Rolling Thunder, Devil's Play, Earthquake, Star of Extinction),
  doubled through Solphim/Dictate of the Twin Gods and replayed via the flashback/
  recursion suite -- the real kill window is ~turn 7-8, not turn 5. The damage-
  redirect/prevention package (Pariah, Boros Reckoner, Spitemare, Stuffy Doll,
  Brash Taunter, Phyrexian Vindicator, Truefire Captain) exists to survive combat
  while all of the above assembles -- it is the deck's actual defensive plan, not
  filler. User-reported real-world result before this session's swaps: the deck
  regularly died before the engine/kill came online, consistent with a real-record
  ~10% win rate. Fixing that -- not raw power -- is the point of any rebuild here.
