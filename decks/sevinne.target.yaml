commander: Sevinne, the Chronoclasm
bracket: 3
threshold: 5
edhrec_theme: graveyard
gameplan: >
  Ramp to 5 and stick Sevinne, then set up a damage-reflection engine:
  Phyrexian Vindicator, Brash Taunter or Stuffy Doll (with Blazing Sunsteel
  to redirect damage onto them) plus Pariah / With Great Power to route
  damage, with Pain for All taxing the table and multipliers (Solphim,
  City on Fire) doubling the reflected damage. Past in Flames and Sevinne's
  copy ability re-cast the burn package from the graveyard. Wins by turning
  symmetric damage into one-sided damage, and by looping Blasphemous Act /
  Star of Extinction through the reflectors.
