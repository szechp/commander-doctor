commander: Lathril, Blade of the Elves
bracket: 3
threshold: 6
edhrec_theme: elves
gameplan: >
  Elf typal go-wide (Elven Empire precon). Mana elves turns 1-3, then flood the
  board with Elves and Elf Warrior tokens while drawing off them (Beast
  Whisperer-style engines). Win with a big anthem/pump attack; Lathril's
  tap-ten-Elves drain (each opponent loses 10) is the backup and finisher.
  Goal: fewest swaps from the precon to a good deck.
