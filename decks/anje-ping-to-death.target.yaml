commander: Anje Falkenrath
bracket: 3
threshold: 3
archetype: aggro
# User 2026-10-07: "madness and discard are intertwined, we cannot pull this
# apart" -- no single slug; rank candidates against BOTH `--theme madness`
# and `--theme discard` explicitly.
# User 2026-10-18: "Madness first, focus on pingers and discard synergies next" -- madness pinned.
edhrec_theme: madness
gameplan: >
  Discard-ping. Anje Falkenrath on turn 2-3 (haste, loots immediately).
  Discard outlets (Anje, Misty Knight, Cool but Rude, loot spells, cycling
  lands) turn every card into a trigger. Payoffs ping or drain EACH opponent
  per discard (Glint-Horn Buccaneer, Magmakin Artillerist, Brallin,
  Tinybones, Cool but Rude level 2, Faith of the Devoted, Monument to
  Endurance), with Archfiend of Ifnir as one-sided board control. Damage
  multipliers cheaper than City on Fire turn the 1-damage pings into real
  clocks. Madness cards are the engine: Anje untaps on ANY madness discard,
  cast or not (her text only checks "if it has madness"), so each madness
  card in hand is another loot and another round of payoff triggers. Judge
  madness cards as Anje fuel, not by their bodies or madness cost; the
  madness count is the key number (user 2026-10-07). Graveyard recursion over
  Bag-of-Holding-style exile: Shadow of the Grave returns every uncast
  madness card discarded this turn (official ruling) for a second loop, and
  Squee, Chainer, Ignite the Future flashback etc. need the graveyard. Win =
  death by a hundred pings plus madness bodies.
  X spells (Banefire, Crackle with Power, Exsanguinate) are no longer a
  priority. Confirmed by the user 2026-10-07 ("i would like multipliers
  also in there. like city on fire but cheaper").
  2026-10-18 rebuild (user: "Madness first, focus on pingers and discard
  synergies next. Protecting Anje should be a prio"; deck type aggro):
  Anje protection (Swiftfoot Boots, Mithril Coat, Kaya's Ghostform, Muck
  Drubb, Deflecting Swat); interaction sized to the aggro sweet spot;
  Torbran as the cheap multiplier for red pings. No combo focus (user
  2026-10-18: the 3-card lines are lucky finds -- both Tortured Existence
  and Paradise Mantle by turn 6 in about 3% of games -- and Worldgorger +
  Animate Dead is bracket 4). Tortured Existence stays as a repeatable
  discard-and-recursion engine. Swiftfoot Boots over Lightning Greaves:
  shroud would stop Mithril Coat and Kaya's Ghostform from attaching.
