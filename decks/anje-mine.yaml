commander: Anje Falkenrath
bracket: 3
threshold: 3
gameplan: >
  Madness/discard value engine. Anje Falkenrath and a suite of discard
  outlets (Bone Miser, Faithless Looting, Thrill of Possibility, Big Score,
  Unexpected Windfall, Skirge Familiar, Currency Converter, Rix Maadi
  Dungeon Palace, Geier Reach Sanitarium, Magus of the Wheel) feed a large
  Madness payoff suite (removal: Gorgon Recluse, Terminal Agony, Dark
  Withering, Big Game Hunter, Nightshade Assassin, Kitchen Imp,
  Alchemist's Greeting; burn: Fiery Temper, Violent Eruption, Alms of the
  Vein; value/bodies: Call to the Netherworld, Blazing Rootwalla, Grave
  Scrabbler, From Under the Floorboards, Necrogoyf, Reckless Wurm,
  Shadowgrange Archfiend, Archfiend of Spite) at their (usually much
  cheaper) Madness cost rather than hardcast. A secondary discard-payoff
  layer (Marauding Mako, Surly Badgersaur, Olivia Mobilized for War,
  Glint-Horn Buccaneer, Archfiend of Ifnir, Monument to Endurance) turns
  every discard into a body, counters, or damage regardless of Madness.
  Graveyard recursion (Chainer Nightmare Adept, Squee Goblin Nabob, Call
  to the Netherworld, Grave Scrabbler, Mortuary Mire) and B/R removal/burn
  (Exsanguinate, Banefire, Crackle with Power, Blasphemous Act) round it
  out as the actual closing power. Stated back to the user from the
  decklist itself on 2026-09-06.
