  - date: 2026-09-06
    kind: note
    text: >
      CORRECTED lesson (the first version of this note, reasoning about
      Madness cost DISCOUNT, was itself wrong and led to a second bad
      cut -- Murderous Compulsion -- right after the first): do not cut
      ANY card in madness_payoff (anje-mine.derived.yaml) as "safe
      filler" regardless of whether its Madness cost is discounted vs
      hardcast. Anje Falkenrath's own text is "whenever you discard a
      card, IF IT HAS MADNESS, untap Anje Falkenrath" -- that trigger
      keys on the card simply HAVING madness, not on cost. Every
      madness_payoff member re-activates the core engine when discarded,
      cost parity or not. A real cut from this deck must come from
      outside madness_payoff (and outside discard_outlet/graveyard_
      recursion members that produce colour, per the earlier Skirge
      Familiar/Rakdos Locket note) -- verify a candidate card is in NONE
      of anje-mine.derived.yaml's effect_classes before proposing it as a
      cut, not just that its individual power level looks low.
