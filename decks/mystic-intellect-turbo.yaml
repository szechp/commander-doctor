commander: Sevinne, the Chronoclasm
bracket: 3
threshold: 8  # turn the redirect/burn kill is actually online, NOT Sevinne's own cmc (5) --
  # confirmed with user 2026-09-10.
edhrec_theme: burn  # redirect-burn build; low sample (22 decks) -- pinned 2026-09-26
gameplan: >
  Jeskai (WUR) damage-redirection wincon, not a value/control pile. The core is a
  package of damage-redirect creatures (Boros Reckoner: "whenever dealt damage,
  deals that much to any target"; Brash Taunter, indestructible, redirects to
  target opponent; Stuffy Doll, indestructible, redirects to a chosen player;
  Truefire Captain, redirects to target player; Phyrexian Vindicator, prevents
  damage to itself and redirects it to any other target instead) that turns
  self-inflicted board damage into reach. Payoff spells are symmetrical/self-
  damage effects cast while these bodies are on board -- Blasphemous Act (13 to
  each creature), Earthquake (X to each creature without flying and each
  player -- also hits players directly), Star of Extinction (20 to each
  creature/planeswalker), Pain for All (enchanted creature deals its power then
  reflects damage taken to each opponent) -- doubled through Dictate of the Twin
  Gods. Ramp (9 rocks including Sol Ring/Lotus Petal) gets the redirect bodies
  and Sevinne down early; graveyard fill (Faithless Looting, Desperate Ravings,
  Frantic Search, Deep Analysis, Think Twice) sets up Sevinne's copy trigger
  (first instant/sorcery cast from graveyard each turn is copied) so the same
  board-wipe/burn spell can be recast late-game for a second redirected hit --
  the deck's actual finisher, not an early kill. Real threshold is ~turn 7-8:
  when redirect bodies + a symmetrical damage spell + (ideally) Sevinne
  recursion are all live, not when Sevinne alone resolves.
